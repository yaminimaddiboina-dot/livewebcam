<html lang="en"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LiveWebcam · Fun Filters</title><style>
:root{color-scheme:dark;--blue:#7acbff}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 0,#3d5d83,#0b101a 62%);font-family:Arial,sans-serif;color:#f8fbff}.app{width:min(1000px,94vw);margin:auto;padding:26px 0}.head{display:flex;align-items:center;justify-content:space-between;gap:18px;margin-bottom:18px}.brand{font-weight:900;font-size:28px;letter-spacing:-1.5px}.brand b{color:var(--blue)}.status{font-size:12px;color:#c4d1dc}.stage{position:relative;aspect-ratio:16/9;background:#030507;border:1px solid #ffffff2c;border-radius:20px;overflow:hidden;box-shadow:0 28px 75px #000a}video,canvas{position:absolute;width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}canvas{display:none}.empty{position:absolute;inset:0;z-index:2;display:grid;place-items:center;text-align:center;color:#b5c2cf;padding:25px;pointer-events:none}.empty strong{display:block;color:#fff;font-size:21px;margin-bottom:8px}.controls{display:flex;align-items:center;gap:11px;flex-wrap:wrap;margin-top:18px;padding:16px;background:#ffffff0b;border:1px solid #ffffff18;border-radius:14px}button,select{border:0;border-radius:8px;padding:12px 15px;font:600 14px Arial;cursor:pointer}button{background:#f5f8fa;color:#111923}button.secondary{background:#ffffff18;color:#fff}button.capture{background:var(--blue);color:#072039}button:disabled{opacity:.45;cursor:not-allowed}select{background:#26394c;color:#fff;border:1px solid #ffffff20;max-width:190px}label{font-size:13px;color:#d4dfe7;display:flex;align-items:center;gap:9px}label:last-child{margin-left:auto}input{accent-color:var(--blue)}.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;margin-top:18px}.gallery:empty{display:none}.shot{width:100%;aspect-ratio:1;border-radius:10px;object-fit:cover;border:1px solid #ffffff23}@media(max-width:650px){.app{padding:16px 0}.head{flex-direction:column;align-items:flex-start}.controls{align-items:stretch}.controls label{justify-conten </style></head><body><main class="app"><div class="head"><div class="brand">LIVE<b>WEBCAM</b></div><div id="status" class="status">Live · Dreamy active</div></div><div class="stage"><video id="video" autoplay="" playsinline="" muted="" style="filter: brightness(1.30303) saturate(1.55556) blur(0.588235px); display: block;"></video><canvas id="canvas" width="640" height="480" style="filter: brightness(1.30303) saturate(1.55556) blur(0.588235px); display: none;"></canvas><div id="empty" class="empty" hidden=""><div><strong>Live filters &amp; fun camera</strong>Start your camera and choose a filter.</div></div></div><div class="controls"><button id="start" disabled="">Start camera</button><button id="stop" class="secondary">Stop</button><button id="snap" class="capture">◉ Take photo</button><label>Filter <select id="filter"><option value="bw">Black &amp; white</option><option value="vintage">Vintage</option><option value="warm">Warm</option><option value="cool">Cool</option><option value="sepia">Sepia</option><option value="bright">Bright</option><option value="dream">Dreamy</option><option value="blur">Blur</option><option value="invert">Invert</option><option value="big">Big head</option><option value="small">Small head</option><option value="distort">Face distortion</option><option value="natural">Natural</option></select></label><label>Strength <input id="strength" type="range" min="0" max="100" value="100"><span id="pct">100%</span></label></div><div class="gallery" id="gallery"></div></main><script>
const video=document.querySelector('#video'),canvas=document.querySelector('#canvas'),ctx=canvas.getContext('2d'),empty=document.querySelector('#empty'),status=document.querySelector('#status'),start=document.querySelector('#start'),stop=document.querySelector('#stop'),snap=document.querySelector('#snap'),filter=document.querySelector('#filter'),range=document.querySelector('#strength'),pct=document.querySelector('#pct'),gallery=document.querySelector('#gallery');let stream,raf,faces=[],detecting=false,detector='FaceDetector'in window?new FaceDetector({fastMode:true,maxDetectedFaces:1}):null;const funny=new Set(['big','small','distort']);const css={bw:x=>`grayscale(${x}%) contrast(1.15)`,vintage:x=>`sepia(${x*.62}%) contrast(1.12) brightness(.94) saturate(.78)`,warm:x=>`sepia(${x*.46}%) saturate(1.25) brightness(1.06)`,cool:x=>`hue-rotate(${x*.7}deg) saturate(1.18)`,sepia:x=>`sepia(${x}%)`,bright:x=>`brightness(${1+x/130}) saturate(1.1)`,dream:x=>`brightness(${1+x/330}) saturate(${1+x/180}) blur(${x/170}px)`,blur:x=>`blur(${x/30}px)`,invert:x=>`invert(${x}%)`,natural:x=>'none'};function isFunny(){return funny.has(filter.value)}function apply(){const x=+range.value;pct.textContent=x+'%';video.style.filter=isFunny()?'none':css[filter.value](x);canvas.style.filter=isFunny()?'none':css[filter.value](x);if(stream)status.textContent='Live · '+filter.options[filter.selectedIndex].text+' active'}async function findFaces(){if(!detector||detecting||!video.videoWidth)return;detecting=true;try{faces=await detector.detect(video)}catch{}detecting=false}function draw(){raf=requestAnimationFrame(draw);if(!stream||!isFunny())return;const w=canvas.width=video.videoWidth,h=canvas.height=video.videoHeight;ctx.clearRect(0,0,w,h);ctx.drawImage(video,0,0,w,h);findFaces();const f=faces[0]?.boundingBox;if(!f)return;const x=f.x,y=f.y,fw=f.width,fh=f.height,scale=filter.value==='big'?1.55:filter.value==='small'?.62:1;const dx=x-(fw*scale-fw)/2,dy=y-(fh*scale-fh)/2;if(filter.value==='distort'){ctx.save();ctx.beginPath();ctx.ellipse(x+fw/2,y+fh/2,fw*.78,fh*.52,0,0,Math.PI*2);ctx.clip();ctx.drawImage(video,x,y,fw,fh,x-fw*.28,y+fh*.1,fw*1.56,fh*.8);ctx.restore()}else{ctx.save();ctx.beginPath();ctx.ellipse(x+fw/2,y+fh/2,fw*.58,fh*.6,0,0,Math.PI*2);ctx.clip();ctx.drawImage(video,x,y,fw,fh,dx,dy,fw*scale,fh*scale);ctx.restore()}}async function open(){try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user'},audio:false});video.srcObject=stream;await video.play();empty.hidden=true;start.disabled=false;start.disabled=true;stop.disabled=false;snap.disabled=false;canvas.style.display=isFunny()?'block':'none';video.style.display=isFunny()?'none':'block';apply();draw()}catch(e){status.textContent='Camera permission needed';empty.innerHTML='<div><strong>Allow camera permission</strong>Then select Start camera again.</div>'}}function close(){cancelAnimationFrame(raf);stream?.getTracks().forEach(t=>t.stop());stream=null;video.srcObject=null;canvas.style.display='none';video.style.display='block';empty.hidden=false;status.textContent='Camera is off';start.disabled=false;stop.disabled=true;snap.disabled=true}filter.onchange=()=>{const f=isFunny();canvas.style.display=f?'block':'none';video.style.display=f?'none':'block';apply()};range.oninput=apply;start.onclick=open;stop.onclick=close;snap.onclick=()=>{if(!stream)return;const out=document.createElement('canvas'),o=out.getContext('2d');out.width=isFunny()?canvas.width:video.videoWidth;out.height=isFunny()?canvas.height:video.videoHeight;if(isFunny())o.drawImage(canvas,0,0);else{o.filter=css[filter.value](+range.value);o.drawImage(video,0,0,out.width,out.height)}const url=out.toDataURL('image/jpeg',.92),img=new Image();img.src=url;img.className='shot';img.title='Click to download';img.onclick=()=>{const a=document.createElement('a');a.href=url;a.download='livewebcam-photo.jpg';a.click()};gallery.prepend(img);const a=document.createElement('a');a.href=url;a.download='livewebcam-photo.jpg';a.click()};addEventListener('beforeunload',close);apply();
</script>
